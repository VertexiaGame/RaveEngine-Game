[package]
name = "VERTIGO-ProjectRave"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["mobile"]
default-members = ["."]

[lib]
name = "RaveEngineLib"
path = "src/lib.rs"

[[bin]]
name = "RaveEngineStudio"
path = "src/bin/studio.rs"

[[bin]]
name = "RaveEngineClient"
path = "src/bin/client.rs"

[[bin]]
name = "RaveEngineServer"
path = "src/bin/server.rs"

[dependencies]
bevy = { version = "0.19.0", features = ["default", "free_camera", "bevy_dev_tools", "android-native-activity", "jpeg", "webp", "gif", "wav", "mp3", "vorbis"] }
bevy_egui = "0.40.1"
egui_extras = { version = "0.34", features = ["syntect"] }
rand = "0.10.1"
avian3d = "0.7.0"
tobj = "4.0.4"
lightyear = { version = "0.28.0", default-features = false, features = [
  "std",
  "client",
  "server",
  "replication",
  "prediction",
  "interpolation",
  "udp",
  "netcode",
  "input_native",
  "compression_lz4"
] }

serde = { version = "1.0", features = ["derive"] }
zstd = "0.13"
serde_json = "1.0"
crossbeam-channel = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
mlua = { version = "0.12", features = ["luau", "luau-jit", "send", "serde", "macros"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.17.2"

[features]
bench = []

[dev-dependencies]
naga = { version = "29.0.4", features = ["wgsl-in"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3